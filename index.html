
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#78bdb2"
  >

  <meta
    name="description"
    content="Tiny Tech Museum is an interactive retro gaming museum. Explore iconic consoles, gaming history, and nostalgic memories."
  >

  <title>Tiny Tech Museum | Memory Lane</title>

  <!-- Custom favicon -->
  <!-- Add your favicon.png to the assets folder -->
  <link
    rel="icon"
    type="image/png"
    href="assets/favicon.png"
  >

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScript -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- =====================================
       FLOATING BACKGROUND BUBBLES
  ====================================== -->

  <div
    class="bubble-background"
    aria-hidden="true"
  ></div>


  <!-- =====================================
       MAIN RETRO COMPUTER
  ====================================== -->

  <main class="computer">

    <!-- COMPUTER SCREEN -->
    <div class="screen">


      <!-- =================================
           STARTUP SCREEN
      ================================== -->

      <section
        id="startup"
        class="startup"
        aria-label="Tiny Tech Museum startup"
      >

        <!-- Animated pixel face -->
        <div
          class="pixel-face"
          aria-hidden="true"
        >
          <span class="eye"></span>
          <span class="eye"></span>
          <span class="mouth"></span>
        </div>

        <!-- Museum title -->
        <h1>TINY TECH MUSEUM</h1>

        <p>
          Your childhood called.
          It left a save file.
        </p>

        <!-- Start button -->
        <button
          id="start-btn"
          type="button"
        >
          ENTER MUSEUM.exe
        </button>

      </section>


      <!-- =================================
           RETRO DESKTOP
      ================================== -->

      <section
        id="desktop"
        class="desktop hidden"
        aria-label="Tiny Tech Museum desktop"
      >

        <!-- Desktop header -->
        <header class="desktop-header">

          <span>tinyOS ♡</span>

          <span>MEMORY LANE / 1.0</span>

        </header>


        <!-- Welcome message -->
        <div class="welcome">

          <h2>Welcome back, player!</h2>

          <p>
            Pick a memory to explore.
          </p>

        </div>


        <!-- =================================
             GAMING DEVICE ICONS
             Generated by script.js
        ================================== -->

        <div
          id="desktop-icons"
          class="desktop-icons"
          aria-label="Gaming device exhibits"
        ></div>


        <!-- =================================
             MUSEUM EXHIBIT WINDOW
        ================================== -->

        <div
          id="museum-window"
          class="museum-window hidden"
          role="dialog"
          aria-modal="true"
          aria-labelledby="window-title"
        >

          <!-- Window title bar -->
          <div class="window-bar">

            <span id="window-title">
              Museum Archive
            </span>

            <!-- Close button -->
            <button
              id="close-window"
              type="button"
              aria-label="Close museum exhibit"
            >
              ×
            </button>

          </div>


          <!-- Exhibit content -->
          <!-- Generated by script.js -->
          <div
            id="window-content"
            class="window-content"
          ></div>

        </div>


        <!-- =================================
             DESKTOP TASKBAR
        ================================== -->

        <footer class="taskbar">

          <!-- System name -->
          <span>✦ tinyOS</span>

          <!-- Online indicator -->
          <span class="system-status">

            <span
              class="status-dot"
              aria-hidden="true"
            ></span>

            SYSTEM ONLINE

          </span>

          <!-- Version year -->
          <span>EST. 2026</span>

        </footer>

      </section>

    </div>


    <!-- =====================================
         RETRO CONSOLE CONTROLS
    ====================================== -->

    <div
      class="console-controls"
      aria-hidden="true"
    >

      <!-- Directional pad -->
      <div class="dpad">

        <span class="dpad-vertical"></span>

        <span class="dpad-horizontal"></span>

      </div>


      <!-- Console center -->
      <div class="console-center">

        <!-- Speaker holes -->
        <div class="speaker">

          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>

        </div>


        <!-- Console branding -->
        <span class="console-label">
          tinyOS ♡
        </span>

        <!-- Little personality detail -->
        <span class="console-subtitle">
          WHO WANTS TO PLAY?
        </span>

      </div>


      <!-- Game buttons -->
      <div class="game-buttons">

        <span class="button-pink"></span>

        <span class="button-yellow"></span>

      </div>

    </div>


    <!-- =====================================
         POWER LIGHT
    ====================================== -->

    <div
      class="power-light"
      aria-hidden="true"
    ></div>

  </main>

</body>
</html>
